[package]
name = "thalyx-user-k4store"
description = "K4 user domain: k4store, the managed state service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "k4store"
path = "src/main.rs"

[features]
# Tables sized for a consumer with real trees and real evidence; the medium
# format is unchanged. See `state.rs`.
large-index = []
# Every bound principal may publish, not only the two K4's package names.
every-principal-publishes = []
# Silences the note written per record appended and the notes written per
# publication, as k4disk's `quiet-io` does for its per-operation notes. Only the
# measurement image (`--k4-io-notes off`) has it. See `state.rs`.
quiet-io = []
# Keeps the bytes of the trees, manifests, policies, validations and receipts
# this run wrote or read back and verified, so that reading one again does not
# go back to the medium (ADR-032). Only the Thalyx stage has it, with
# `large-index`; every K4 and K5 gate image reads the medium as before.
verified-cache = []

[dependencies]
thalyx-abi.workspace = true
thalyx-user-rt.workspace = true
thalyx-user-k4fmt.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
