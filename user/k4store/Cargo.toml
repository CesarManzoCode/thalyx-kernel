[package]
name = "thalyx-user-k4store"
description = "K4 user domain: k4store, the managed state service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "k4store"
path = "src/main.rs"

[features]
# Tables sized for a consumer with real trees and real evidence; the medium
# format is unchanged. See `state.rs`.
large-index = []
# Every bound principal may publish, not only the two K4's package names.
every-principal-publishes = []

[dependencies]
thalyx-abi.workspace = true
thalyx-user-rt.workspace = true
thalyx-user-k4fmt.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
