[package]
name = "thalyx-user-k5super"
description = "K5 supervisor: builds the native domains of the Thalyx port and the services they stand on"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "k5super"
path = "src/main.rs"

[features]
# Silences the note written per effect receipt drained, as k4store's and
# k4disk's `quiet-io` do for theirs. Only the measurement image
# (`--k4-io-notes off`) has it. See `audit.rs`.
quiet-io = []

[dependencies]
thalyx-abi.workspace = true
thalyx-user-rt.workspace = true
thalyx-user-k4fmt.workspace = true
thalyx-user-k5pkg.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
