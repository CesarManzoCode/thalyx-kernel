# Both the kernel and the user programs are static ET_EXEC images placed by a
# linker script at a fixed virtual address. The default relocation model for
# x86_64-unknown-none is PIC; a position-independent image would need a
# relocation pass that neither the boot loader nor the kernel's bounded ELF
# loader performs, so the model is fixed to `static` here instead.
[target.x86_64-unknown-none]
rustflags = ["-C", "relocation-model=static"]

[build]
target-dir = "build/cargo"

# The loader is a PE image. rust-lld stamps every link with a fresh CodeView
# GUID and a randomised PDB name, which would make the loader the one artefact
# whose digest changes on every build. Nothing debugs the loader through that
# record — the kernel is what carries debug info — so the linker is told not to
# emit it. The link timestamp is pinned separately, through SOURCE_DATE_EPOCH.
[target.x86_64-unknown-uefi]
rustflags = ["-C", "link-arg=/DEBUG:NONE"]
