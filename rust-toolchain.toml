# Pinned toolchain for Thalyx-Kernel. Reproducible builds require this exact
# version: the kernel and the loader depend on target definitions (code model,
# soft-float, red zone) that are properties of the toolchain, not of this repo.
[toolchain]
channel = "1.98.1"
profile = "minimal"
components = ["rust-src", "llvm-tools", "clippy", "rustfmt"]
targets = ["x86_64-unknown-uefi", "x86_64-unknown-none"]
