[workspace]
resolver = "3"
members = [
    "abi",
    "boot/protocol",
    "boot/uefi",
    "kernel",
    "user/rt",
    "user/worker",
    "user/trespasser",
    "user/wxprobe",
    "user/k2super",
    "user/k2server",
    "user/k2client",
    "user/k3super",
    "user/k3worker",
    "user/k3driver",
]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.98.1"
license = "NOASSERTION"
publish = false

[workspace.dependencies]
thalyx-abi = { path = "abi" }
thalyx-boot-protocol = { path = "boot/protocol" }
thalyx-user-rt = { path = "user/rt" }

# Bare-metal images must not unwind: there is no unwinder and no runtime below
# the kernel. `panic = "abort"` is also the target default for both
# x86_64-unknown-none and x86_64-unknown-uefi; stating it keeps a profile
# override from silently reintroducing landing pads.
[profile.dev]
panic = "abort"
overflow-checks = true
debug = true

[profile.release]
panic = "abort"
overflow-checks = true
debug = true
lto = false
codegen-units = 1
