[workspace]
resolver = "3"
members = [
    "abi",
    "boot/protocol",
    "boot/uefi",
    "kernel",
    "user/rt",
    "user/worker",
    "user/trespasser",
    "user/wxprobe",
    "user/k2super",
    "user/k2server",
    "user/k2client",
    "user/k3super",
    "user/k3worker",
    "user/k3driver",
    "user/k4fmt",
    "user/k4disk",
    "user/k4store",
    "user/k4client",
    "user/k4super",
    "user/k5pkg",
    "user/k5super",
    "user/k5work",
    "user/k5link",
    "user/k6super",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.98.1"
license = "NOASSERTION"
publish = false

[workspace.dependencies]
thalyx-abi = { path = "abi" }
thalyx-boot-protocol = { path = "boot/protocol" }
thalyx-user-rt = { path = "user/rt" }
thalyx-user-k4fmt = { path = "user/k4fmt" }
thalyx-user-k5pkg = { path = "user/k5pkg" }

# Bare-metal images must not unwind: there is no unwinder and no runtime below
# the kernel. `panic = "abort"` is also the target default for both
# x86_64-unknown-none and x86_64-unknown-uefi; stating it keeps a profile
# override from silently reintroducing landing pads.
[profile.dev]
panic = "abort"
overflow-checks = true
debug = true

# Debug information does not change the code generated, only the build's time
# and the non-loadable sections. The kernel keeps all of it. The programs enter
# the package stripped of it (`tools/build_image.py`), and nothing reads more
# than an address-to-line table from the full copy kept beside the image, so
# they carry only that.
[profile.release]
panic = "abort"
overflow-checks = true
debug = "line-tables-only"
lto = false
codegen-units = 1

[profile.release.package.thalyx-kernel]
debug = true

# The loader runs once, before the kernel, and spends its time in firmware
# calls; it is built for size. The kernel and the programs keep `opt-level = 3`.
# It is linked with `/DEBUG:NONE` (`.cargo/config.toml`), so whatever debug
# information it and its dependencies were compiled with was discarded at the
# link: they are compiled without it.
[profile.release.package.thalyx-boot-uefi]
opt-level = "s"
debug = false

# Every package outside the workspace is one of the loader's dependencies or a
# procedure macro of theirs.
[profile.release.package."*"]
debug = false
