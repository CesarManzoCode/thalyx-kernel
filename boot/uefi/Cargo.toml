[package]
name = "thalyx-boot-uefi"
description = "UEFI loader for Thalyx-Kernel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bootx64"
path = "src/main.rs"

[dependencies]
thalyx-boot-protocol.workspace = true
uefi = { version = "=0.40.0", default-features = false, features = ["alloc", "global_allocator"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
